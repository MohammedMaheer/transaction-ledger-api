name: transaction-ledger

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ledger
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set a strong POSTGRES_PASSWORD in .env.production}
      POSTGRES_DB: ledger
    volumes:
      - ledger_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ledger -d ledger"]
      interval: 3s
      timeout: 3s
      retries: 20
    mem_limit: 256m

  migrate:
    image: transaction-ledger-api:local
    build: .
    environment:
      DATABASE_URL: postgresql+asyncpg://ledger:${POSTGRES_PASSWORD}@db:5432/ledger
    command: ["alembic", "upgrade", "head"]
    depends_on:
      db:
        condition: service_healthy
    mem_limit: 256m

  api:
    image: transaction-ledger-api:local
    build: .
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+asyncpg://ledger:${POSTGRES_PASSWORD}@db:5432/ledger
      LOG_LEVEL: INFO
    command:
      - uvicorn
      - app.main:create_app
      - --factory
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --proxy-headers
      - --forwarded-allow-ips=*
    ports:
      - "127.0.0.1:${API_PORT:-18765}:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 3
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    read_only: true
    tmpfs: ["/tmp:size=16m,mode=1777"]
    pids_limit: 128
    mem_limit: 256m

volumes:
  ledger_data:
